name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ranking tests compare against fzf itself, so they run against a known release.
  FZF_VERSION: 0.74.4
  # Pinned, so a new ruff release can't fail a build on code that hasn't changed.
  RUFF_VERSION: 0.16.8

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pipx run "ruff==$RUFF_VERSION" check --output-format=github .
      - run: pipx run "ruff==$RUFF_VERSION" format --check .
      - run: shellcheck scripts/*.sh

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Python Herdscope supports, one between, and the newest.
        python: ["3.11", "3.13", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install fzf
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=linux_amd64 ;;
            macOS-ARM64) target=darwin_arm64 ;;
            macOS-X64) target=darwin_amd64 ;;
          esac
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v$FZF_VERSION/fzf-$FZF_VERSION-$target.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python -m unittest discover --start-directory tests --top-level-directory . --verbose
